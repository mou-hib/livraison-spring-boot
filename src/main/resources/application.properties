spring.application.name=livraison

# --- MariaDB ---
spring.datasource.url=jdbc:mariadb://localhost:3306/livraison_db
spring.datasource.username=livraison
spring.datasource.password=livraison123

# --- JPA / Hibernate ---
# update = create/alter tables from the entities (fine for a school project, never in production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Keeps the DB session open during the whole HTTP request (lets Jackson read the lists to build the JSON)
spring.jpa.open-in-view=true
